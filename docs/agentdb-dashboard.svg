<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020B16"/>
      <stop offset="1" stop-color="#071A2D"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#0B1827"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8FA2FF"/>
      <stop offset="1" stop-color="#5E8CFF"/>
    </linearGradient>
    <linearGradient id="hBar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3BF0FF"/>
      <stop offset="1" stop-color="#5AA2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#020812" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1400" height="860" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="28" y="28" width="330" height="804" rx="28" fill="url(#sidebar)" stroke="#1E3452"/>
  </g>

  <g>
    <rect x="70" y="72" width="54" height="54" rx="18" fill="url(#blueGlow)"/>
    <text x="97" y="109" text-anchor="middle" fill="white" font-size="33" font-weight="700" font-family="Inter, Arial, sans-serif">A</text>

    <text x="145" y="92" fill="#9EB3C8" font-size="16" font-weight="600" letter-spacing="4" font-family="Inter, Arial, sans-serif">RUNTIME</text>
    <text x="145" y="140" fill="#F2F8FF" font-size="50" font-weight="700" font-family="Inter, Arial, sans-serif">AgentDB</text>

    <line x1="64" y1="176" x2="330" y2="176" stroke="#2C4057"/>

    <g>
      <rect x="64" y="220" width="228" height="54" rx="14" fill="#14293F" stroke="#2D4463"/>
      <text x="90" y="255" fill="#F2F7FF" font-size="28" font-weight="600" font-family="Inter, Arial, sans-serif">Overview</text>
      <rect x="64" y="286" width="228" height="54" rx="14" fill="#1A3459" stroke="#3A5E92"/>
      <text x="90" y="321" fill="#EAF2FF" font-size="28" font-weight="600" font-family="Inter, Arial, sans-serif">Processes</text>
      <text x="90" y="389" fill="#D6E7F7" font-size="28" font-weight="500" font-family="Inter, Arial, sans-serif">Network</text>
      <text x="90" y="457" fill="#D6E7F7" font-size="28" font-weight="500" font-family="Inter, Arial, sans-serif">Services</text>
      <text x="90" y="525" fill="#D6E7F7" font-size="28" font-weight="500" font-family="Inter, Arial, sans-serif">Permissions</text>
      <text x="90" y="593" fill="#D6E7F7" font-size="28" font-weight="500" font-family="Inter, Arial, sans-serif">Actions</text>
      <text x="90" y="661" fill="#D6E7F7" font-size="28" font-weight="500" font-family="Inter, Arial, sans-serif">Diagnostics</text>
    </g>
  </g>

  <g>
    <rect x="410" y="48" width="930" height="720" rx="28" fill="rgba(10, 17, 26, 0.6)" stroke="#1B2D42"/>

    <text x="466" y="113" fill="#9FB1C5" font-size="18" font-weight="700" letter-spacing="5" font-family="Inter, Arial, sans-serif">SECURE EXECUTION RUNTIME</text>
    <text x="466" y="176" fill="#F2F8FF" font-size="72" font-weight="800" font-family="Inter, Arial, sans-serif">AgentDB</text>

    <text x="466" y="248" fill="#C9D9EC" font-size="28" font-weight="500" font-family="Inter, Arial, sans-serif">
      <tspan x="466" dy="0">A policy-enforced execution layer for AI agents operating real</tspan>
      <tspan x="466" dy="42">infrastructure. It limits blast radius, requires approval for sensitive</tspan>
      <tspan x="466" dy="42">actions, and leaves a complete audit trail for every decision and</tspan>
      <tspan x="466" dy="42">operational change.</tspan>
    </text>

    <g>
      <rect x="466" y="338" width="395" height="148" rx="18" fill="#0D1E30" stroke="#1A3D59"/>
      <rect x="466" y="338" width="395" height="6" fill="url(#hBar)" rx="3"/>
      <text x="492" y="382" fill="#A9BCD1" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif">Risk surface reduction</text>
      <text x="492" y="433" fill="#F2F8FF" font-size="58" font-weight="800" font-family="Inter, Arial, sans-serif">98.7%</text>
      <rect x="492" y="454" width="74" height="24" rx="12" fill="#112F28"/>
      <text x="514" y="471" fill="#7BE7A9" font-size="18" font-weight="700" font-family="Inter, Arial, sans-serif">+1.2%</text>
      <text x="582" y="471" fill="#A9BCD1" font-size="18" font-weight="500" font-family="Inter, Arial, sans-serif">policy coverage</text>

      <rect x="884" y="338" width="395" height="148" rx="18" fill="#0D1E30" stroke="#1A3D59"/>
      <rect x="884" y="338" width="395" height="6" fill="url(#hBar)" rx="3"/>
      <text x="910" y="382" fill="#A9BCD1" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif">Live agent scope</text>
      <text x="910" y="433" fill="#F2F8FF" font-size="58" font-weight="800" font-family="Inter, Arial, sans-serif">6</text>
      <rect x="910" y="454" width="88" height="24" rx="12" fill="#122E3D"/>
      <text x="930" y="471" fill="#C7F2FF" font-size="18" font-weight="700" font-family="Inter, Arial, sans-serif">Stable</text>
      <text x="1018" y="471" fill="#A9BCD1" font-size="18" font-weight="500" font-family="Inter, Arial, sans-serif">infrastructure view</text>

      <rect x="466" y="516" width="395" height="148" rx="18" fill="#0D1E30" stroke="#1A3D59"/>
      <rect x="466" y="516" width="395" height="6" fill="url(#hBar)" rx="3"/>
      <text x="492" y="560" fill="#A9BCD1" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif">Operational approvals</text>
      <text x="492" y="610" fill="#F2F8FF" font-size="58" font-weight="800" font-family="Inter, Arial, sans-serif">5</text>
      <rect x="492" y="634" width="70" height="24" rx="12" fill="#132E2A"/>
      <text x="514" y="651" fill="#7BE7A9" font-size="18" font-weight="700" font-family="Inter, Arial, sans-serif">+1</text>
      <text x="574" y="651" fill="#A9BCD1" font-size="18" font-weight="500" font-family="Inter, Arial, sans-serif">pending review</text>

      <rect x="884" y="516" width="395" height="148" rx="18" fill="#0D1E30" stroke="#1A3D59"/>
      <rect x="884" y="516" width="395" height="6" fill="url(#hBar)" rx="3"/>
      <text x="910" y="560" fill="#A9BCD1" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif">Auditability</text>
      <text x="910" y="610" fill="#F2F8FF" font-size="58" font-weight="800" font-family="Inter, Arial, sans-serif">4</text>
      <rect x="910" y="634" width="78" height="24" rx="12" fill="#321E2D"/>
      <text x="934" y="651" fill="#FF8A8A" font-size="18" font-weight="700" font-family="Inter, Arial, sans-serif">2</text>
      <text x="988" y="651" fill="#A9BCD1" font-size="18" font-weight="500" font-family="Inter, Arial, sans-serif">degraded</text>
      <text x="1096" y="651" fill="#A9BCD1" font-size="18" font-weight="500" font-family="Inter, Arial, sans-serif">execution trail</text>
    </g>
  </g>
</svg>
